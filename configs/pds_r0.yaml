# R0 model, K+ + PDS condition (docs/FOCUS.md):
#   G-run graph -> diffusion-attention encoder -> weighted-sum readout -> LayerNorm -> MLP head,
#   regression on the G4-seq mismatch score; 30,442 trainable parameters.
# Every setting is written out (no hidden defaults); the loader rejects unknown keys.
# Train: python -m g4shape.train --config configs/pds_r0.yaml [--set section.key=value ...]
data:
  genome_dir: data/hg19              # build_genome_store output
  index_dir: data/g4seq_PDS          # complete G4-seq index (GSE110582, hg19): every row, no weights
  # train: every row off chr1/chr2 (315,437,985); no weight column, so plain MSE (TransG4 / G4mismatch);
  # val: a fixed 1,000,000-row uniform chr2 subset (max_val + subsample_seed) for early stopping and
  #   threshold tuning: a full chr2 pass (31.7M rows) at every validation costs too much;
  # test: every chr1 row (29,923,093), the protocol of the published values (docs/GATES_AGENT_PROMPT.md).
  # The weighted subset data/g4seq_PDS_fast (scripts/make_subset.py) is kept only for the golden test.
  flank: 100                         # window = 100 + 15 + 100 = 215 nt
  reverse_strand: +                  # '+' rows are reverse-complemented (TransG4)
  max_train: null                    # null: all training rows
  max_val: 1000000                   # fixed uniform chr2 subset (see above)
  max_test: null                     # null: every chr1 row
  subsample_seed: 0                  # seeds the val subset
  batch_size: 256                    # GLOBAL batch (split over GPUs)
  eval_batch_size: 512
  num_workers: auto                  # per rank; from the idle-CPU budget
features:
  min_run_len: 2                     # G-runs of >= 2 G are the graph's nodes
  edge_radius: 50                    # runs <= 50 nt apart are linked
  context_bases: 2
  flank_window: 20
  position_encoding: true            # signed offset of runs / loops from the target bin (RBF)
  gap_encoding: raw                  # loop length as one raw column ('bucket': loop classes)
  loop_end_bases: 0                  # one-hot of the first / last N loop bases (0 = off)
  target_len: 15                     # the scored bin, centred in the window
  pos_rbf: 16
  pos_sigma: 10.0
model:
  hidden_dim: 64
  dropout: 0.2
  graph_encoder: diffusion_gat
  graph_encoder_kwargs:
    k: 3                             # diffusion hops per layer
    alpha: 0.1                       # initial hop weights alpha(1-alpha)^t
    num_heads: 4
    merge: mean
    num_layers: 2
    pool: weight_and_sum             # weighted-sum readout
    input_mlp: true
    use_edge_attr: true
    add_self_loops: true
    negative_slope: 0.01
    project: null                    # null: only when in_dim != out_dim
    layer_dropout: 0.0
    residual: false
    batch_norm: false
    activation: null
  classifier: binary_mlp             # Linear(64, 64) -> ReLU -> Dropout -> Linear(64, 1)
  classifier_kwargs: {}              # its widths and dropout are wired from hidden_dim / dropout
task:
  label_threshold: 35.0              # G4 = score > 35 (TransG4)
  y_mean: 2.6497314875100493       # exact full-train-split stats of data/g4seq_PDS
  y_std: 7.775820658477637
  threshold_grid: {start: 5.0, stop: 45.0, step: 0.1}   # G4 call threshold, tuned on val
optim:
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-07
  weight_decay: 0.0
  scheduler: exponential             # lr * decay_rate ** (step / decay_steps)
  decay_rate: 0.99
  decay_steps: 10000
  plateau_factor: 0.5                # used only by scheduler: plateau
  plateau_patience: 3
trainer:
  max_epochs: 1
  seed: 42
  accelerator: auto                  # free GPUs, else CPU
  devices: auto
  strategy: auto
  precision: 32-true
  gradient_clip_val: null
  log_every_n_steps: 50
  checkpoint_every_minutes: 30.0
  out_dir: runs
  run_name: pds_r0
resources:
  max_gpus: null
  min_free_memory_gb: 8.0
  max_utilization: 10.0
  memory_share: 0.9
  sample_seconds: 3.0
  on_busy: wait
  wait_timeout_min: 120.0
  poll_seconds: 60.0
  cpu_share: 1.0                     # all idle cores (featurisation is the bottleneck)
  max_workers_per_device: 64         # no per-GPU cap; the idle-core budget decides
  nice: 10
  nccl_check: true
  rescale_check_minutes: 15.0
