# R0 model, K+ + PDS condition: G-run graph -> diffusion-attention encoder -> weighted-sum readout
#   -> LayerNorm -> MLP head, regression on the G4-seq mismatch score (docs/FOCUS.md).
# Data: weighted subsample data/g4seq_PDS_fast of the full index data/g4seq_PDS, built with:
#   python -m scripts.make_subset --source data/g4seq_PDS --out data/g4seq_PDS_fast \
#       --cutoff 10 --keep-low 0.02 --val 1000000 --test 2000000 --seed 0
# train: every window with score >= 10 (weight 1) + a 2 % Bernoulli sample of the windows < 10 (weight 50,
#        the `sample_weight` of the MSE: an unbiased estimate of the full-data loss).
# val:   uniform 1,000,000 chr2 windows; test: uniform 2,000,000 chr1 windows (unweighted).
# task.y_mean / y_std = exact full-train-split stats. data.batch_size is the GLOBAL batch.
# Train: python -m g4shape.train --config configs/pds_r0.yaml [--set section.key=value ...]
data:
  genome_dir: data/hg19
  index_dir: data/g4seq_PDS_fast
  flank: 100
  reverse_strand: +
  max_train: null
  max_val: null
  max_test: null
  subsample_seed: 0
  batch_size: 256
  eval_batch_size: 512
  num_workers: auto
model:
  hidden_dim: 64
  dropout: 0.2
  graph_encoder: diffusion_gat
  classifier: binary_mlp
  graph_encoder_kwargs: {}
  classifier_kwargs: {}
task:
  label_threshold: 35.0
  y_mean: 2.6497314875100493
  y_std: 7.775820658477637
  threshold_grid: {start: 5.0, stop: 45.0, step: 0.1}   # tuned on val; 30-34.9 clipped the optimum
trainer:
  max_epochs: 1
  seed: 42
  accelerator: auto
  devices: auto
  strategy: auto
  precision: 32-true
  gradient_clip_val: null
  log_every_n_steps: 50
  out_dir: runs
  run_name: pds_r0
resources:
  max_gpus: null
  min_free_memory_gb: 8.0
  max_utilization: 10.0
  memory_share: 0.9
  sample_seconds: 3.0
  on_busy: wait
  wait_timeout_min: 120.0
  poll_seconds: 60.0
  cpu_share: 1.0               # all idle cores (featurisation is the bottleneck)
  max_workers_per_device: 64   # effectively no per-GPU cap; the idle-core budget decides
  nice: 10
  nccl_check: true
features:
  min_run_len: 2
  edge_radius: 50
  context_bases: 2
  flank_window: 20
  position_encoding: true
optim:
  lr: 0.001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-07
  weight_decay: 0.0
  scheduler: exponential
  decay_rate: 0.99
  decay_steps: 10000
  plateau_factor: 0.5
  plateau_patience: 3
